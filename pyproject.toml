[project]
name = "raven_bmi_sys"
dynamic = ["version"]
authors = [
  {name = "Robert Mietrach", email = "robert.mietrach@tu-dresden.de"}
]
description = "raven_bmi_sys is a thin wrapper around the Raven C++ Basic Model Interface (BMI)"
keywords = ["Raven", "hydrological modelling framework", "hydrology", "bmi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "numpy >= 2.0,<3.0"
]

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
sdist.exclude = ["benchmarking", "RavenCaller", ".cache", ".github", "compile_commands.json"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "python/raven_bmi_sys/__init__.py"

[tool.scikit-build.cmake.define]
PYTHON = true
COMPILE_STATIC_LIB = true
COMPILE_EXE = false
